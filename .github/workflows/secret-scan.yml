---
# betterleaks で PR の差分コミットから秘密情報を検出する
#
# - gha-workflows の reusable workflow を使う: https://github.com/greendrop/gha-workflows
# - betterleaks のバージョンはこのリポジトリの mise.toml / mise.lock で指定する（lefthook の pre-commit と同じバージョン）
name: secret-scan

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # チェック名は「secret-scan / secret-scan」になる（github-terraform の ruleset で必須にしている）
  secret-scan:
    permissions:
      contents: read
    uses: greendrop/gha-workflows/.github/workflows/secret-scan.yml@a308cc65c40fcf4503b0143d0698082d7222838e # v0.1.0
