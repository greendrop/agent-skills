---
# betterleaks で PR の差分コミットから秘密情報を検出する
#
# - gha-workflows の composite action（actions/secret-scan）を使う: https://github.com/greendrop/gha-workflows
# - betterleaks はこのリポジトリの mise.toml / mise.lock のバージョンを使う（lefthook の pre-commit と同じバージョン）
name: secret-scan

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: betterleaks

      - name: Run secret-scan
        uses: greendrop/gha-workflows/actions/secret-scan@ba92f5c1af2372b47d44d1ef6076488afd846c87 # v0.4.0
